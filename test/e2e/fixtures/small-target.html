<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Small targets</title></head>
<body>
  <main>
    <h1>Pagination</h1>
    <!-- Two adjacent 10 x 10 px buttons: below the 24 x 24 px minimum of WCAG 2.2 (2.5.8) -->
    <button type="button" aria-label="Previous page" style="width:10px;height:10px;padding:0;margin:0"></button><button type="button" aria-label="Next page" style="width:10px;height:10px;padding:0;margin:0"></button>
  </main>
</body>
</html>
